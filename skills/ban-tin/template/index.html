<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("assets/fonts/BeVietnamPro-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("assets/fonts/BeVietnamPro-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("assets/fonts/BeVietnamPro-ExtraBold.ttf") format("truetype");
        font-weight: 800;
      }
      :root {
        --navy-900: __C_DARK__;
        --navy-800: __C_MID__;
        --navy-600: __C_LIGHT__;
        --ink: #f3f7ff;
        --ink-soft: #c9d8f2;
        --amber: __C_ACCENT__;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--navy-900);
        font-family: "Be Vietnam Pro", sans-serif; color: var(--ink);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--navy-900); }
      .scene {
        position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: radial-gradient(ellipse 120% 70% at 50% 72%, var(--navy-600) 0%, var(--navy-800) 55%, var(--navy-900) 100%);
      }
      .scene + .scene { opacity: 0; }
      .topbar {
        position: absolute; top: 0; left: 0; width: 1080px; height: 100px; background: var(--navy-900);
        display: flex; align-items: center; justify-content: space-between; padding: 0 56px;
      }
      .brand { font-weight: 800; font-size: 30px; letter-spacing: 0.08em; color: var(--ink); }
      .brand b { color: var(--amber); }
      .chip { font-weight: 700; font-size: 24px; letter-spacing: 0.12em; color: var(--navy-900); background: var(--amber); padding: 6px 16px; border-radius: 8px; }
      .photo { position: absolute; top: 100px; left: 0; width: 1080px; height: 860px; overflow: hidden; }
      .photo-inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .photo-bg { position: absolute; inset: 0; }
      .photo-img { position: absolute; inset: 0; width: 1080px; height: 860px; object-fit: cover; display: block; }
      .photo-img.ai { height: 960px; object-position: center top; } /* cắt logo góc dưới của ảnh AI */
      .ghost-num { position: absolute; right: 40px; bottom: -40px; width: 400px; height: 560px; display: block; }
      .rain {
        position: absolute; left: 0; top: -300px; width: 1080px; height: 1460px;
        background-image: repeating-linear-gradient(100deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 38px, rgba(255,255,255,0.12) 39px, rgba(255,255,255,0) 41px);
      }
      .icon { position: relative; width: 460px; height: 460px; display: block; }
      .card-text {
        position: relative; width: 900px; font-weight: 800; font-size: 96px; line-height: 1.15;
        text-align: center; color: var(--ink);
      }
      .credit { position: absolute; top: 972px; right: 56px; font-weight: 700; font-size: 24px; color: var(--ink-soft); }
      .label { position: absolute; top: 1030px; left: 56px; display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 54px; color: var(--ink); }
      .label svg { width: 46px; height: 46px; display: block; }
      .counter { position: absolute; top: 1036px; right: 56px; font-weight: 800; font-size: 40px; color: var(--amber); border: 3px solid var(--amber); border-radius: 40px; padding: 2px 22px; }
      .body { position: absolute; top: 1150px; left: 56px; width: 968px; font-weight: 700; line-height: 1.42; text-align: left; color: var(--ink); }
      .watermark { position: absolute; left: 0; bottom: 90px; width: 1080px; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0.16; }
      .watermark svg { width: 150px; height: 150px; display: block; }
      .watermark span { font-weight: 800; font-size: 64px; letter-spacing: 0.1em; color: var(--ink); }
      .logo-mark { position: absolute; left: 160px; top: 1100px; width: 760px; height: 760px; border-radius: 50%; object-fit: cover; display: block; opacity: 0.1; }
      .cover-rain {
        position: absolute; left: 0; top: -400px; width: 1080px; height: 2720px;
        background-image: repeating-linear-gradient(100deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 44px, rgba(255,255,255,0.1) 45px, rgba(255,255,255,0) 47px);
      }
      .cover-glow { position: absolute; left: 90px; top: 260px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(246,185,59,0.28) 0%, rgba(246,185,59,0) 65%); }
      .cover-bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; display: block; }
      .cover-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,22,51,0.25) 0%, rgba(6,22,51,0.35) 38%, rgba(6,22,51,0.92) 56%, var(--navy-900) 75%); }
      .cover-icon { position: absolute; left: 260px; top: 330px; width: 560px; height: 560px; display: block; }
      .cover-text { position: absolute; left: 72px; top: 1000px; width: 936px; }
      .cover-kicker { display: inline-block; font-weight: 800; font-size: 32px; letter-spacing: 0.14em; color: var(--navy-900); background: var(--amber); padding: 8px 20px; border-radius: 8px; }
      .cover-title { margin-top: 34px; font-weight: 800; font-size: 104px; line-height: 1.1; color: var(--ink); text-shadow: 0 6px 0 var(--navy-900); }
      .cover-date { margin-top: 30px; font-weight: 700; font-size: 50px; color: var(--amber); }
      .cover-rule { margin-top: 28px; width: 936px; height: 4px; background: var(--amber); display: block; }
      .cover-teaser { margin-top: 28px; font-weight: 700; font-size: 42px; line-height: 1.35; color: var(--ink-soft); }
      .cover-teaser.hook { font-weight: 800; font-size: 56px; line-height: 1.25; color: var(--ink); }
      .outro-center { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 70px; }
      .outro-logo { width: 260px; height: 260px; display: block; }
      .outro-logo-img { width: 300px; height: 300px; border-radius: 50%; object-fit: cover; display: block; box-shadow: 0 0 0 8px var(--amber); }
      .question { width: 900px; background: var(--amber); border-radius: 36px; padding: 44px 56px; text-align: center; color: var(--navy-900); box-shadow: 0 12px 0 var(--navy-900); }
      .question small { display: block; font-weight: 800; font-size: 32px; letter-spacing: 0.12em; margin-bottom: 14px; }
      .question p { font-weight: 800; font-size: 54px; line-height: 1.25; }
      .outro-center.has-q { gap: 56px; }
      .outro-center.has-q .pill { font-size: 46px; padding: 36px 60px; }
      .pill-wrap { position: relative; width: 900px; }
      .pill { width: 900px; background: var(--ink); border-radius: 90px; padding: 52px 70px; font-weight: 800; font-size: 58px; line-height: 1.3; text-align: center; color: var(--navy-900); box-shadow: 0 12px 0 var(--navy-900); }
      .star { position: absolute; right: -40px; top: -70px; width: 160px; height: 160px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920"></div>
    <script>
      // Dữ liệu do scripts/ban_tin.py chèn vào. Không sửa tay.
      const DATA = __DATA__;

      const PIN = '<svg viewBox="0 0 24 24" fill="var(--amber)"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
      const GLOBE = '<svg viewBox="0 0 100 100" fill="none" stroke="#f3f7ff" stroke-width="6"><circle cx="50" cy="50" r="42"/><path d="M8 50h84M50 8c-16 18-16 66 0 84M50 8c16 18 16 66 0 84"/></svg>';
      const W = "#e8f0ff", A = "var(--amber)";
      const ICONS = {
        pin: `<path d="M100 20a56 56 0 0 0-56 56c0 42 56 104 56 104s56-62 56-104a56 56 0 0 0-56-56z" fill="${W}"/><circle cx="100" cy="76" r="22" fill="${A}"/>`,
        globe: `<circle cx="100" cy="100" r="76" fill="none" stroke="${W}" stroke-width="10"/><path d="M24 100h152M100 24c-32 36-32 116 0 152M100 24c32 36 32 116 0 152" fill="none" stroke="${W}" stroke-width="8"/><circle cx="148" cy="52" r="16" fill="${A}"/>`,
        flag: `<path d="M40 28v152" stroke="${W}" stroke-width="10" stroke-linecap="round"/><rect x="46" y="34" width="120" height="80" rx="6" fill="#da251d"/><path d="M106 52l7 21h22l-18 13 7 21-18-13-18 13 7-21-18-13h22z" fill="#ffde00"/>`,
        money: `<rect x="20" y="58" width="160" height="90" rx="12" fill="${W}"/><circle cx="100" cy="103" r="30" fill="${A}"/><text x="100" y="118" text-anchor="middle" font-family="Be Vietnam Pro" font-weight="800" font-size="44" fill="#061633">₫</text>`,
        bolt: `<path d="M112 16L48 112h44l-12 72 72-104h-46z" fill="${A}"/>`,
        car: `<path d="M40 120l14-40h92l14 40" stroke="${W}" stroke-width="10" stroke-linejoin="round" fill="none"/><rect x="30" y="118" width="140" height="40" rx="10" fill="${W}"/><circle cx="58" cy="138" r="10" fill="${A}"/><circle cx="142" cy="138" r="10" fill="${A}"/><rect x="44" y="158" width="20" height="18" rx="4" fill="${W}"/><rect x="136" y="158" width="20" height="18" rx="4" fill="${W}"/><rect x="78" y="60" width="44" height="18" rx="4" fill="${A}"/>`,
        shield: `<path d="M100 18l66 24v48c0 44-30 76-66 92-36-16-66-48-66-92V42z" fill="${W}"/><path d="M70 98l22 22 40-44" stroke="${A}" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
        school: `<path d="M100 30l84 40-84 40-84-40z" fill="${W}"/><path d="M52 90v42c0 16 96 16 96 0V90" fill="none" stroke="${W}" stroke-width="10"/><path d="M176 72v52" stroke="${A}" stroke-width="8" stroke-linecap="round"/><circle cx="176" cy="130" r="9" fill="${A}"/>`,
        warning: `<path d="M100 26l70 122H30z" fill="${A}"/><path d="M100 66v44" stroke="#061633" stroke-width="12" stroke-linecap="round"/><circle cx="100" cy="130" r="7" fill="#061633"/><path d="M14 172c14-10 28-10 42 0s28 10 42 0 28-10 42 0 28 10 42 0" stroke="${W}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
        leaf: `<path d="M44 156C44 80 100 36 168 32c-4 70-44 124-124 124z" fill="${W}"/><path d="M44 156C80 120 112 92 150 54" stroke="${A}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
        walk: `<circle cx="104" cy="36" r="16" fill="${W}"/><path d="M100 60l-18 50 22 18-8 52M100 60l26 34 26 6M86 98l-30 16" stroke="${W}" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 184h160" stroke="${A}" stroke-width="8" stroke-dasharray="20 14"/>`,
        chart: `<path d="M30 170h150" stroke="${W}" stroke-width="8" stroke-linecap="round"/><rect x="44" y="120" width="26" height="44" fill="${W}"/><rect x="88" y="90" width="26" height="74" fill="${W}"/><rect x="132" y="56" width="26" height="108" fill="${A}"/><path d="M40 96l50-36 34 20 52-50" stroke="${A}" stroke-width="7" fill="none" stroke-linecap="round"/>`,
        ship: `<path d="M30 120h140l-22 44H52z" fill="${W}"/><path d="M100 30v86M100 34l46 66h-46z" fill="${A}" stroke="${W}" stroke-width="4"/><path d="M14 182c14-8 28-8 42 0s28 8 42 0 28-8 42 0 28 8 42 0" stroke="${W}" stroke-width="7" fill="none"/>`,
        home: `<path d="M24 98l76-66 76 66" stroke="${W}" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 92v82h108V92" fill="${W}"/><rect x="86" y="120" width="28" height="54" fill="${A}"/>`,
        mic: `<rect x="76" y="20" width="48" height="96" rx="24" fill="${W}"/><path d="M52 92c0 28 22 48 48 48s48-20 48-48M100 140v36M70 178h60" stroke="${A}" stroke-width="10" fill="none" stroke-linecap="round"/>`,
      };
      const CAT = {
        "khu-vuc": { label: "Tin " + (DATA.region || "khu vực"), icon: "pin", bg: ["#2b6cb8", "#123a73"] },
        "tinh": { label: "Tin " + (DATA.province || "tỉnh"), icon: "pin", bg: ["#2c7f8c", "#0f3b5c"] },
        "trong-nuoc": { label: "Tin trong nước", icon: "flag", bg: ["#3a5fb0", "#18306b"] },
        "the-gioi": { label: "Tin thế giới", icon: "globe", bg: ["#3d5a99", "#1a2b5c"] },
      };
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const brandHtml = () => {
        const b = DATA.brand || ["NEWS", "VIDEO"];
        return `<span class="brand">${esc(b[0])}<b>${esc(b[1] || "")}</b></span>${DATA.chip ? `<span class="chip">${esc(DATA.chip)}</span>` : "<span></span>"}`;
      };
      const bodySize = (t) => (t.length <= 110 ? 56 : t.length <= 160 ? 52 : t.length <= 210 ? 48 : 44);

      const T = DATA.timing; // {cover, item, outro, total}
      const root = document.getElementById("root");
      const items = DATA.items;
      let html = "";

      // ---- Bìa ----
      html += `<div id="s0" class="scene" data-layout-allow-overflow>
        ${DATA.cover._img
          ? `<div class="photo-inner" id="s0-bgwrap" data-layout-allow-overflow><img class="cover-bg" src="${esc(DATA.cover._img)}" alt="" /></div><div class="cover-shade"></div>`
          : `<div class="cover-glow" id="s0-glow"></div><svg class="cover-icon" id="s0-icon" viewBox="0 0 200 200" fill="none">${ICONS[DATA.cover.icon] || ICONS.pin}</svg>`}
        <div class="cover-rain" id="s0-rain" data-layout-allow-overflow></div>
        <div class="topbar">${brandHtml()}</div>
        <div class="cover-text">
          <span class="cover-kicker" id="s0-kicker">${esc(DATA.cover.kicker || "BẢN TIN")}</span>
          <h1 class="cover-title" id="s0-title">${esc(DATA.cover.title)}</h1>
          <p class="cover-date" id="s0-date">${esc(DATA.cover.subtitle)}</p>
          <span class="cover-rule" id="s0-rule"></span>
          ${DATA.cover.teaser ? `<p class="cover-teaser${DATA.cover._img ? " hook" : ""}" id="s0-teaser">${esc(DATA.cover.teaser)}</p>` : ""}
        </div>
      </div>`;

      // ---- Tin ----
      items.forEach((it, i) => {
        const n = i + 1;
        const cat = CAT[it.category] || CAT["khu-vuc"];
        const label = it.label || cat.label;
        let visual;
        if (it._img) {
          visual = `<img class="photo-img${it._ai ? " ai" : ""}" src="${esc(it._img)}" alt="" />`;
        } else if (it._text) {
          visual = `<div class="photo-bg" style="background: radial-gradient(circle at 50% 45%, ${cat.bg[0]} 0%, ${cat.bg[1]} 72%)"></div>
            <div class="rain" id="s${n}-rain" data-layout-allow-overflow></div>
            <p class="card-text">${esc(it._text)}</p>`;
        } else {
          const icon = ICONS[it._icon] || ICONS[cat.icon];
          visual = `<div class="photo-bg" style="background: radial-gradient(circle at 50% 45%, ${cat.bg[0]} 0%, ${cat.bg[1]} 72%)"></div>
            <div class="rain" id="s${n}-rain" data-layout-allow-overflow></div>
            <svg class="ghost-num" data-layout-allow-overflow viewBox="0 0 400 560"><text x="400" y="500" text-anchor="end" font-family="Be Vietnam Pro" font-weight="800" font-size="${n >= 10 ? 330 : 520}" fill="rgba(255,255,255,0.1)">${n}</text></svg>
            <svg class="icon" viewBox="0 0 200 200" fill="none">${icon}</svg>`;
        }
        html += `<div id="s${n}" class="scene" data-layout-allow-overflow>
          <div class="photo"><div class="photo-inner" id="s${n}-zoom" data-layout-allow-overflow>${visual}</div></div>
          ${DATA.logo ? `<img class="logo-mark" src="${esc(DATA.logo)}" alt="" />` : ""}
          <div class="topbar">${brandHtml()}</div>
          <div class="credit" id="s${n}-credit">${esc(it._credit)}</div>
          <div class="label" id="s${n}-label">${PIN}${esc(label)}</div>
          <div class="counter" id="s${n}-counter">${n}/${items.length}</div>
          <p class="body" id="s${n}-body" style="font-size:${bodySize(it.text)}px">${esc(it.text)}</p>
          ${DATA.logo ? "" : `<div class="watermark">${GLOBE}<span>${esc((DATA.brand || ["NEWS", "VIDEO"]).join(""))}</span></div>`}
        </div>`;
      });

      // ---- Kết ----
      const last = items.length + 1;
      html += `<div id="s${last}" class="scene" data-layout-allow-overflow>
        <div class="cover-rain" id="s${last}-rain" data-layout-allow-overflow></div>
        <div class="topbar">${brandHtml()}</div>
        <div class="outro-center${DATA.outro_question ? " has-q" : ""}" id="s${last}-center">
          ${DATA.logo
            ? `<img class="outro-logo-img" id="s${last}-logo" src="${esc(DATA.logo)}" alt="" />`
            : `<svg class="outro-logo" id="s${last}-logo" viewBox="0 0 100 100" fill="none" stroke="#f3f7ff" stroke-width="5"><circle cx="50" cy="50" r="42"/><path d="M8 50h84M50 8c-16 18-16 66 0 84M50 8c16 18 16 66 0 84"/></svg>`}
          ${DATA.outro_question ? `<div class="question" id="s${last}-q"><small>BẠN NGHĨ SAO? BÌNH LUẬN NHÉ</small><p>${esc(DATA.outro_question)}</p></div>` : ""}
          <div class="pill-wrap" id="s${last}-pill">
            <div class="pill">${esc(DATA.outro)}</div>
            <svg class="star" id="s${last}-star" viewBox="0 0 100 100"><path d="M50 6l13 28 30 4-22 21 6 30-27-15-27 15 6-30L7 38l30-4z" fill="var(--amber)" stroke="var(--navy-900)" stroke-width="5" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>`;
      root.innerHTML = html;

      // ---- Timeline ----
      const tl = gsap.timeline({ paused: true });
      if (DATA.cover._img) {
        tl.fromTo("#s0-bgwrap", { scale: 1.12 }, { scale: 1.02, duration: T.cover + 0.5, ease: "power1.out" }, 0);
      } else {
        tl.fromTo("#s0-icon", { y: -40, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 0);
        tl.fromTo("#s0-glow", { scale: 0.85 }, { scale: 1.08, duration: T.cover, ease: "sine.inOut" }, 0);
      }
      tl.fromTo("#s0-rain", { y: -200 }, { y: 0, duration: T.cover, ease: "none" }, 0);
      tl.fromTo("#s0-kicker", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo("#s0-title", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
      tl.fromTo("#s0-date", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, 0.45);
      tl.fromTo("#s0-rule", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.5);
      if (DATA.cover.teaser) tl.fromTo("#s0-teaser", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.7);

      const cuts = [];
      for (let k = 0; k <= items.length; k++) cuts.push(T.cover + k * T.item);
      cuts.forEach((t, i) => {
        tl.to("#s" + i, { x: -1080, duration: 0.5, ease: "power3.inOut" }, t);
        tl.fromTo("#s" + (i + 1), { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, t);
      });

      items.forEach((it, i) => {
        const n = i + 1, t = T.cover + i * T.item;
        tl.fromTo("#s" + n + "-zoom", { scale: 1 }, { scale: 1.06, duration: T.item + 0.5, ease: "sine.inOut" }, t);
        if (document.getElementById("s" + n + "-rain")) tl.fromTo("#s" + n + "-rain", { y: -220 }, { y: 0, duration: T.item + 0.5, ease: "none" }, t);
        tl.fromTo("#s" + n + "-label", { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t + 0.35);
        tl.fromTo("#s" + n + "-counter", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, t + 0.45);
        tl.fromTo("#s" + n + "-body", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" }, t + 0.5);
        tl.fromTo("#s" + n + "-credit", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.out" }, t + 0.6);
      });

      const to = T.cover + items.length * T.item;
      tl.fromTo("#s" + last + "-rain", { y: -200 }, { y: 0, duration: T.outro, ease: "none" }, to);
      tl.fromTo("#s" + last + "-logo", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, to + 0.35);
      if (DATA.outro_question) tl.fromTo("#s" + last + "-q", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, to + 0.45);
      tl.fromTo("#s" + last + "-pill", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, to + 0.6);
      tl.fromTo("#s" + last + "-star", { rotation: -40, scale: 0 }, { rotation: 0, scale: 1, duration: 0.6, ease: "back.out(2.2)" }, to + 0.8);
      tl.to("#s" + last + "-center", { opacity: 0, duration: 0.6, ease: "power1.in" }, T.total - 0.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
